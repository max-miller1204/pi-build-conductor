---
name: Pi server compatibility

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/compatibility.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/run-server-compatibility.mjs"
      - "src/workers/**"
      - "test/server-compatibility.test.ts"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      conductor_ref:
        description: Conductor Git ref to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-compatibility:
    name: Pi 0.83.0 compatible server
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out conductor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.conductor_ref || github.sha }}
          persist-credentials: false
      - name: Check out pinned compatible Pi server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: max-miller1204/pi
          ref: b713633149eae9f14bac029af4938b6476d8202d
          path: compatible-pi
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install conductor dependencies
        run: npm ci --ignore-scripts
      - name: Install compatible Pi dependencies
        working-directory: compatible-pi
        run: npm ci --ignore-scripts
      - name: Build compatible Pi
        working-directory: compatible-pi
        run: npm run build
      - name: Test server policy implementation
        working-directory: compatible-pi
        run: npm test --workspace packages/server
      - name: Exercise the real server socket and worker lifecycle
        env:
          PI_COMPAT_CHECKOUT: ${{ github.workspace }}/compatible-pi
        run: npm run test:compatibility
