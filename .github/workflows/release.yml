---
name: Release

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify tag and release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: >-
          node scripts/check-release.mjs
          --tag "$RELEASE_TAG"
          --github-prerelease "$RELEASE_PRERELEASE"
      - name: Run complete release checks
        run: npm run release:check

  compatibility:
    name: Verify compatible server
    needs: verify
    uses: ./.github/workflows/compatibility.yml
    with:
      conductor_ref: ${{ github.event.release.tag_name }}

  publish:
    name: Publish to npm
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [verify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify an OIDC-capable npm CLI
        run: npm --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify publication invariants
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: >-
          node scripts/check-release.mjs
          --tag "$RELEASE_TAG"
          --github-prerelease "$RELEASE_PRERELEASE"
          --publish
      - name: Publish with trusted OIDC provenance
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          dist_tag=latest
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            dist_tag=next
          fi
          npm publish --access public --tag "$dist_tag"
