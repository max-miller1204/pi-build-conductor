---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
      timezone: Etc/UTC
    # The Pi packages are not an ordinary dependency. They are one leg of a
    # three-way compatibility pin together with
    # conductorCompatibility.upstreamPiCommit and the compatible Pi server fork
    # commit, and scripts/check-release.mjs requires the development pin to
    # equal conductorCompatibility.testedPiVersion exactly. An isolated bump can
    # therefore never pass version:check. Upgrading Pi means rebuilding the
    # server fork and re-running test:compatibility, which is the cross-repository
    # procedure documented in README.md and RELEASING.md.
    ignore:
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@earendil-works/pi-coding-agent"
    groups:
      # Group only patch and minor updates. Major updates arrive as individual
      # pull requests so a toolchain jump is reviewed and validated on its own
      # instead of riding along with unrelated routine bumps.
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:47"
      timezone: Etc/UTC
